name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: 类型检查与单元测试
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cf-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cf-agent/package-lock.json
      - run: npm ci
      - run: npm test
