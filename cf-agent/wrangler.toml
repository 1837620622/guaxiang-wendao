name = "guaxiang-wendao"
main = "src/index.ts"
compatibility_date = "2025-01-01"
workers_dev = true

# 子域用 Custom Domain 自动建 DNS；主域继续走已有路由
routes = [
  { pattern = "guaxiang-wendao.chuankangkk.top", custom_domain = true },
  { pattern = "chuankangkk.top/*", zone_name = "chuankangkk.top" },
  { pattern = "www.chuankangkk.top/*", zone_name = "chuankangkk.top" },
]


# 前端静态页
# run_worker_first：所有请求先进 Worker，由它补安全头（CSP 等），再交给 ASSETS 取文件。
# 不设的话，资源层会直接返回静态文件，Worker 里的响应头逻辑对页面不生效。
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

# D1 数据库（先 wrangler d1 create guaxiang，再把 id 填进来）
[[d1_databases]]
binding = "DB"
database_name = "guaxiang"
database_id = "0b26298a-40f9-4c1c-9d26-08685ca1dd5b"

# Workers AI
[ai]
binding = "AI"

# KV 答案缓存（省 AI 算力）
[[kv_namespaces]]
binding = "CACHE"
id = "5126e810b03f4c279a61c02ea270e578"

[vars]
MODEL = "qwen/qwen3.8-27b"
FALLBACK_MODEL = "qwen-plus"
BOOK_TITLE = "改命记实录"
BOOK_AUTHOR = "道之光"

[observability]
enabled = true
