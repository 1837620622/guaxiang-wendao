<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#f3eee2">
<title>卦象问道 · 改命记实录</title>
<style>
  :root{
    --paper:#f3eee2; --paper2:#fbf8f0; --ink:#24221e; --ink2:#5f594d;
    --line:#ded3bd; --red:#a83b2c; --red2:#8d2f23; --gold:#b08a4a;
    --green:#3f7d55; --amber:#a8791f; --shadow:0 8px 28px rgba(60,45,25,.09);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0;color:var(--ink);
    background:
      radial-gradient(1100px 520px at 50% -12%, #fffdf6 0%, transparent 62%),
      radial-gradient(800px 500px at 100% 100%, #efe6d3 0%, transparent 55%),
      var(--paper);
    font-family:"Songti SC","Noto Serif SC","Source Han Serif SC",-apple-system,"PingFang SC",serif;
    display:flex;flex-direction:column;
    height:100vh;height:100dvh;
    overflow:hidden;
  }
  /* ==== 顶部 ==== */
  header{
    flex:none;z-index:20;padding:12px 16px 10px;
    border-bottom:1px solid var(--line);
    background:linear-gradient(180deg,rgba(251,248,240,.97),rgba(243,238,226,.92));
    backdrop-filter:blur(12px);
    animation:headerIn .5s ease both;
  }
  @keyframes headerIn{from{transform:translateY(-14px);opacity:0}to{transform:none;opacity:1}}
  .brand{max-width:820px;margin:0 auto;display:flex;align-items:center;gap:11px}
  .seal{
    width:40px;height:40px;border-radius:10px;flex:none;display:grid;place-items:center;
    background:linear-gradient(160deg,#b8452f,#8d2f23);color:#fff;font-size:20px;font-weight:700;
    box-shadow:0 4px 14px rgba(168,59,44,.32);
    animation:sealPulse 4s ease-in-out infinite;
  }
  @keyframes sealPulse{0%,100%{box-shadow:0 4px 14px rgba(168,59,44,.32)}50%{box-shadow:0 4px 22px rgba(168,59,44,.5)}}
  h1{font-size:17.5px;margin:0;letter-spacing:.08em;font-weight:600}
  .sub{font-size:11.5px;color:var(--ink2);margin-top:3px;display:flex;align-items:center;gap:6px;letter-spacing:.03em}
  .dot{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px rgba(63,125,85,.13);animation:blink 2.4s infinite}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
  .hbtns{margin-left:auto;display:flex;gap:6px}
  .hbtn{
    border:1px solid #ddd1bb;background:#faf6ec;color:#6b6455;border-radius:8px;
    font-size:11.5px;padding:5px 10px;cursor:pointer;font-family:inherit;transition:.15s;white-space:nowrap;
  }
  .hbtn:hover{background:#f2ebdb}
  .hbtn:active{transform:scale(.96)}

  /* ==== 消息流 ==== */
  main{flex:1;min-height:0;overflow-y:auto;padding:16px 14px 20px;scroll-behavior:smooth;overscroll-behavior:contain;display:flex;flex-direction:column}
  main::-webkit-scrollbar{width:6px}
  main::-webkit-scrollbar-thumb{background:#d8cbb2;border-radius:3px}
  .wrap{max-width:820px;margin:0 auto;width:100%}

  .msg{margin-bottom:20px;display:flex;gap:9px;animation:rise .32s cubic-bezier(.2,.8,.3,1) both}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .avatar{
    width:30px;height:30px;border-radius:9px;flex:none;display:grid;place-items:center;
    font-size:13px;margin-top:2px;user-select:none;
  }
  .msg.user{flex-direction:row-reverse}
  .msg.user .avatar{background:#e6dccb;color:#6b6455}
  .msg.bot .avatar{background:linear-gradient(160deg,#b8452f,#8d2f23);color:#fff}
  .body{max-width:min(88%,680px);min-width:0}
  .bubble{
    padding:12px 15px;border-radius:14px;font-size:15px;line-height:1.85;
    background:var(--paper2);border:1px solid var(--line);box-shadow:var(--shadow);
    white-space:pre-wrap;word-break:break-word;
  }
  .msg.user .bubble{background:#efe6d4;border-color:#e3d6bf}
  .bubble b{color:var(--red2)}

  /* ==== 回答卡片 ==== */
  .card{
    background:var(--paper2);border:1px solid var(--line);border-radius:14px;
    box-shadow:var(--shadow);overflow:hidden;animation:cardIn .4s cubic-bezier(.2,.8,.3,1) both;
  }
  @keyframes cardIn{from{opacity:0;transform:translateY(12px) scale(.985)}to{opacity:1;transform:none}}
  .card-head{
    padding:12px 15px 10px;display:flex;align-items:center;gap:9px;flex-wrap:wrap;
    border-bottom:1px solid #eee6d6;background:linear-gradient(180deg,#fffdf8,#faf6ec);
  }
  .badge{
    font-size:11.5px;padding:3px 9px;border-radius:999px;font-weight:600;
    font-family:-apple-system,"PingFang SC",sans-serif;letter-spacing:.03em;flex:none;
  }
  .badge.ok{color:#2f6b47;background:#e4f0e7;border:1px solid #cbe3d2}
  .badge.part{color:#8a6318;background:#f8efdb;border:1px solid #eddfbd}
  .badge.no{color:#8d2f23;background:#f8e7e3;border:1px solid #eed3cc}
  .badge.fail{color:#6b6455;background:#eee8da;border:1px solid #e0d7c3}
  .card-head .tag{font-size:11px;color:#9a917d;font-family:-apple-system,sans-serif}
  .card-head .spacer{flex:1}
  .copybtn{
    border:1px solid #e0d5bf;background:#fffdf8;color:#8b8270;border-radius:7px;
    font-size:10.5px;padding:3px 8px;cursor:pointer;font-family:-apple-system,sans-serif;transition:.15s;
  }
  .copybtn:hover{background:#f5eee0;color:#5f594d}
  .copybtn.done{color:#2f6b47;border-color:#cbe3d2;background:#e9f4ec}

  .conclusion{
    padding:14px 16px 4px;font-size:17.5px;line-height:1.6;font-weight:600;letter-spacing:.01em;
    min-height:1.6em;
  }
  .conclusion .q{color:#c9bda4}
  .caret{
    display:inline-block;width:2px;height:1em;background:var(--red);margin-left:2px;
    vertical-align:-2px;animation:caret 1s steps(1) infinite;
  }
  @keyframes caret{0%,50%{opacity:1}51%,100%{opacity:0}}

  .points{padding:6px 10px 10px}
  .point{
    display:flex;gap:10px;padding:10px 8px;border-radius:9px;transition:background .15s;
    font-size:14.5px;line-height:1.75;
    animation:pointIn .38s cubic-bezier(.2,.8,.3,1) both;
    animation-delay:calc(var(--i) * 70ms);
  }
  @keyframes pointIn{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}
  .point:hover{background:#f6f1e4}
  .point .num{
    flex:none;width:20px;height:20px;border-radius:6px;margin-top:3px;
    background:#efe6d3;color:#7a6f58;display:grid;place-items:center;
    font-size:11.5px;font-family:-apple-system,sans-serif;font-weight:600;
  }
  .point.weak .num{background:#f6e8e4;color:#a5543f}
  .point .txt{flex:1;min-width:0}
  .ref{
    display:inline-block;font-size:11.5px;padding:1px 7px;margin-left:4px;
    color:var(--red);background:#f8eeea;border:1px solid #eed9d3;border-radius:5px;
    cursor:pointer;font-family:-apple-system,sans-serif;vertical-align:1px;transition:.15s;
    appearance:none;-webkit-appearance:none;line-height:1.4;
  }
  .ref:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
  .ref:hover{background:#f2ddd6;transform:translateY(-1px)}
  .ref:active{transform:scale(.94)}

  .missing{
    margin:0 16px 14px;padding:10px 12px;border-radius:9px;font-size:13px;line-height:1.7;
    background:#f6f1e3;border:1px dashed #ddd0b5;color:#7a6f58;
    animation:pointIn .4s ease both;animation-delay:.15s;
  }
  .missing b{color:#8a6318;font-weight:600}

  .quotes{padding:0 12px 14px}
  .quotes-title{
    font-size:11.5px;color:#9a917d;letter-spacing:.1em;margin:2px 4px 9px;
    display:flex;align-items:center;gap:7px;
  }
  .quotes-title::after{content:"";flex:1;height:1px;background:#ece3d1}
  details.q{
    border:1px solid var(--line);border-radius:10px;background:#faf6ea;
    margin-bottom:9px;overflow:hidden;transition:border-color .2s, background .2s, box-shadow .25s;
    animation:pointIn .4s ease both;
  }
  @keyframes qIn{from{opacity:0;max-height:0}to{opacity:1;max-height:600px}}
  details.q[open]{background:#fffdf8;border-color:#d7c9ab}
  details.q.hl{box-shadow:0 0 0 3px rgba(176,138,74,.22);border-color:var(--gold)}
  details.q summary{
    list-style:none;cursor:pointer;padding:10px 12px;display:flex;align-items:flex-start;gap:9px;
    font-size:13.5px;line-height:1.5;user-select:none;
  }
  details.q summary::-webkit-details-marker{display:none}
  details.q summary:hover{background:#fdfaf2}
  .qno{
    flex:none;font-size:11px;font-weight:700;color:var(--red);background:#f8eeea;
    border-radius:5px;padding:1px 6px;margin-top:1px;font-family:-apple-system,sans-serif;
  }
  .qmeta{flex:1;min-width:0;color:#4b4538}
  .qmeta .t{display:block;font-size:13px;color:#35312a}
  .qmeta .p{display:block;font-size:11px;color:#9a917d;margin-top:2px;font-family:-apple-system,sans-serif}
  .chev{flex:none;font-size:10px;color:#b3a88f;transition:transform .22s;margin-top:3px}
  details.q[open] .chev{transform:rotate(90deg)}
  .qtext{
    padding:2px 14px 13px 36px;font-size:13.5px;line-height:1.85;color:#4a4438;
    white-space:pre-wrap;border-top:1px dashed #e7dcc6;margin-top:8px;padding-top:11px;
    animation:qIn .28s ease both;
  }
  .verify{
    display:inline-flex;align-items:center;gap:4px;font-size:10.5px;margin-top:7px;
    font-family:-apple-system,sans-serif;padding:2px 7px;border-radius:999px;
  }
  .verify.ok{color:#2f6b47;background:#e6f1e9}
  .verify.bad{color:#8d2f23;background:#f8e7e3}

  /* 图片上传 */
  .imgwrap{
    max-width:820px;margin:0 auto 8px;display:none;position:relative;
  }
  .imgwrap.on{display:block;animation:rise .25s ease both}
  .imgcard{
    display:flex;gap:10px;align-items:center;padding:8px 10px;
    border:1px solid var(--line);border-radius:11px;background:var(--paper2);
    box-shadow:var(--shadow);
  }
  .imgcard img{
    width:54px;height:54px;object-fit:cover;border-radius:8px;flex:none;
    border:1px solid #e6dcc7;background:#fff;
  }
  .imgmeta{flex:1;min-width:0}
  .imgmeta .n{font-size:12.5px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .imgmeta .s{font-size:10.5px;color:#8d8574;font-family:-apple-system,sans-serif;margin-top:2px}
  .imgdel{
    border:1px solid #e0d5bf;background:#fffdf8;color:#8d8574;border-radius:7px;
    width:26px;height:26px;cursor:pointer;flex:none;font-size:15px;line-height:1;
  }
  .imgdel:hover{background:#f8e7e3;border-color:#eed3cc;color:#8d2f23}
  .dropzone{
    position:absolute;inset:0;border:2px dashed var(--gold);border-radius:12px;
    background:rgba(176,138,74,.12);display:none;place-items:center;
    font-size:14px;color:var(--red);z-index:5;pointer-events:none;
  }
  body.dragover .dropzone{display:grid}
  #imgBtn.loading{opacity:.5;pointer-events:none}
  .visionbox{
    margin:0 16px 12px;padding:10px 12px;border-radius:9px;font-size:12.5px;line-height:1.75;
    background:#f3f0e4;border:1px solid #e4dcc6;color:#5f594d;white-space:pre-wrap;
    animation:pointIn .4s ease both;
  }
  .visionbox .vt{
    font-size:10.5px;color:#8d8574;letter-spacing:.1em;margin-bottom:6px;
    font-family:-apple-system,sans-serif;display:flex;align-items:center;gap:6px;
  }
  .visionbox .vt::after{content:"";flex:1;height:1px;background:#e4dcc6}
  .open-orig{
    font-size:10.5px;color:var(--gold);text-decoration:none;border:1px solid #e6dac1;
    background:#fdf8ec;border-radius:6px;padding:1px 6px;margin-left:6px;flex:none;
    font-family:-apple-system,sans-serif;
  }
  .open-orig:hover{background:#f6ecd8}
  .more{padding:0 16px 12px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;animation:pointIn .4s ease both}
  .more .lab{font-size:11px;color:#8d8574;letter-spacing:.08em;font-family:-apple-system,sans-serif}
  .more a{
    font-size:12px;color:var(--ink2);text-decoration:none;background:#f6f1e4;
    border:1px solid #e6dcc7;border-radius:7px;padding:3px 8px;
  }
  .more a:hover{border-color:var(--gold);color:var(--ink)}
  .fb{
    border:1px solid #e0d5bf;background:#fffdf8;border-radius:7px;font-size:11px;
    padding:2px 8px;cursor:pointer;color:#8d8574;font-family:-apple-system,sans-serif;transition:.15s;
  }
  .fb:hover{background:#f5eee0}
  .fb.on{background:#e9f4ec;border-color:#cbe3d2;color:#2f6b47}
  .fb.down.on{background:#f8e7e3;border-color:#eed3cc;color:#8d2f23}
  .meta{
    padding:9px 15px 11px;font-size:10.5px;color:#8d8574;border-top:1px solid #efe7d7;
    display:flex;gap:12px;flex-wrap:wrap;font-family:-apple-system,sans-serif;
  }
  .meta .sp{flex:1}

  /* ==== 打字中 ==== */
  .typing{display:inline-flex;gap:5px;padding:5px 0;align-items:center}
  .typing i{width:6px;height:6px;border-radius:50%;background:#b9ae98;animation:bounce 1.25s infinite}
  .typing i:nth-child(2){animation-delay:.16s}
  .typing i:nth-child(3){animation-delay:.32s}
  .typing span{font-size:12px;color:#8d8574;margin-left:6px;font-family:-apple-system,sans-serif}
  @keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.45}30%{transform:translateY(-5px);opacity:1}}

  /* ==== 底部 ==== */
  footer{
    flex:none;z-index:30;border-top:1px solid var(--line);
    padding:8px 14px calc(8px + env(safe-area-inset-bottom));
    background:color-mix(in srgb, var(--paper) 96%, transparent);
    backdrop-filter:blur(10px);
  }
  /* 模型选择弹层 */
  .sheet{
    position:fixed;inset:0;z-index:60;display:none;align-items:flex-end;
    background:rgba(30,24,16,.36);backdrop-filter:blur(2px);
  }
  .sheet.on{display:flex}
  .sheet-card{
    width:100%;max-width:820px;margin:0 auto;background:var(--paper2);
    border-radius:16px 16px 0 0;box-shadow:0 -8px 32px rgba(40,30,15,.2);
    padding:14px 16px calc(20px + env(safe-area-inset-bottom));
    animation:sheetUp .24s cubic-bezier(.2,.8,.3,1) both;
  }
  @keyframes sheetUp{from{transform:translateY(18px);opacity:.6}to{transform:none;opacity:1}}
  .sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .sheet-head span{font-size:14px;font-weight:600;letter-spacing:.05em}
  .sheet-x{
    border:none;background:none;font-size:22px;line-height:1;color:#8d8574;
    cursor:pointer;padding:2px 6px;border-radius:6px;
  }
  .sheet-x:hover{background:#efe6d4}
  .sheet-body .msel-wrap{max-width:none}
  .sheet-body #modelSel{font-size:13px;padding:9px 30px 9px 12px}
  .sheet-body .mstat{margin-top:8px;display:block;min-height:14px;text-align:center}

  .modelbar{
    max-width:820px;margin:0 auto 7px;display:flex;align-items:center;gap:8px;
    font-family:-apple-system,"PingFang SC",sans-serif;
  }
  .modelbar label{font-size:11px;color:#9a917d;letter-spacing:.06em;flex:none}
  .msel-wrap{position:relative;flex:1;max-width:320px}
  .msel-wrap::after{
    content:"▾";position:absolute;right:10px;top:50%;transform:translateY(-50%);
    font-size:10px;color:#9a917d;pointer-events:none;
  }
  #modelSel{
    width:100%;appearance:none;-webkit-appearance:none;font-family:inherit;
    font-size:12px;color:#4b4538;background:#f8f3e7;
    border:1px solid #ddd1bb;border-radius:9px;padding:6px 26px 6px 10px;cursor:pointer;
    outline:none;transition:.15s;
  }
  #modelSel:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(176,138,74,.12)}
  .mstat{font-size:10.5px;color:#8d8574;font-family:-apple-system,sans-serif;white-space:nowrap}

  .quick{max-width:820px;margin:0 auto 9px;display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;padding-bottom:1px}
  .quick::-webkit-scrollbar{display:none}
  .quick button{
    flex:none;font-size:12.5px;padding:6px 13px;border-radius:999px;cursor:pointer;
    border:1px solid #dcd0b9;background:#fbf7ed;color:#5f594d;white-space:nowrap;
    font-family:inherit;transition:.15s;
  }
  .quick button:hover{background:#f5eee0;transform:translateY(-1px)}
  .quick button:active{transform:scale(.97)}

  .bar{max-width:820px;margin:0 auto;display:flex;gap:9px;align-items:flex-end}
  textarea{
    flex:1;resize:none;border:1px solid #d9cdb6;border-radius:14px;background:#fffdf7;
    padding:12px 15px;font-size:15px;line-height:1.5;color:var(--ink);font-family:inherit;
    max-height:132px;min-height:47px;outline:none;transition:.15s;
  }
  textarea:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(176,138,74,.13)}
  textarea::placeholder{color:#8d8574}
  #micBtn{
    width:47px;height:47px;border-radius:14px;flex:none;cursor:pointer;
    border:1px solid #d9cdb6;background:#fffdf7;color:#8d8574;font-size:18px;
    display:grid;place-items:center;transition:.15s;position:relative;
  }
  #micBtn:hover{border-color:var(--gold);color:var(--red)}
  #micBtn:active{transform:scale(.94)}
  #micBtn.rec{background:#f8e7e3;border-color:#e8b3a8;color:#8d2f23;animation:recPulse 1.2s infinite}
  @keyframes recPulse{0%,100%{box-shadow:0 0 0 0 rgba(168,59,44,.35)}50%{box-shadow:0 0 0 7px rgba(168,59,44,0)}}
  #micBtn[hidden]{display:none}
  #imgBtn{
    width:47px;height:47px;border-radius:14px;flex:none;cursor:pointer;
    border:1px solid #d9cdb6;background:#fffdf7;color:#8d8574;font-size:19px;
    display:grid;place-items:center;transition:.15s;
  }
  #imgBtn:hover{border-color:var(--gold);color:var(--red)}
  #imgBtn:active{transform:scale(.94)}
  #send{
    width:47px;height:47px;border-radius:14px;border:none;cursor:pointer;flex:none;
    background:linear-gradient(160deg,#b8452f,#8d2f23);color:#fff;font-size:20px;
    display:grid;place-items:center;box-shadow:0 5px 16px rgba(168,59,44,.32);transition:.15s;
    position:relative;overflow:hidden;
  }
  #send:active{transform:scale(.94)}
  #send:disabled{opacity:.5;cursor:not-allowed;transform:none}
  #send.loading::before{
    content:"";position:absolute;inset:0;border-radius:14px;
    background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.35) 50%,transparent 70%);
    animation:shine 1.1s linear infinite;
  }
  @keyframes shine{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
  .hint{max-width:820px;margin:7px auto 0;text-align:center;font-size:10.5px;color:#8d8574;font-family:-apple-system,sans-serif}

  /* ===== 模型选择弹层（顶层，不受 media 影响） ===== */
  .sheet{
    position:fixed;inset:0;z-index:60;display:none;align-items:flex-end;
    background:rgba(30,24,16,.36);backdrop-filter:blur(2px);
  }
  .sheet.on{display:flex}
  .sheet-card{
    width:100%;max-width:820px;margin:0 auto;background:var(--paper2);
    border-radius:16px 16px 0 0;box-shadow:0 -8px 32px rgba(40,30,15,.2);
    padding:14px 16px calc(20px + env(safe-area-inset-bottom));
    animation:sheetUp .24s cubic-bezier(.2,.8,.3,1) both;
  }
  @keyframes sheetUp{from{transform:translateY(18px);opacity:.6}to{transform:none;opacity:1}}
  .sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .sheet-head span{font-size:14px;font-weight:600;letter-spacing:.05em}
  .sheet-x{
    border:none;background:none;font-size:22px;line-height:1;color:#8d8574;
    cursor:pointer;padding:2px 6px;border-radius:6px;
  }
  .sheet-x:hover{background:#efe6d4}
  .sheet-body .msel-wrap{max-width:none}
  .sheet-body #modelSel{font-size:13px;padding:9px 30px 9px 12px}
  .sheet-body .mstat{margin-top:8px;display:block;min-height:14px;text-align:center}

  /* 宽屏：快捷问题换行显示，不用横向滚动 */
  @media (min-width:641px){
    .quick{flex-wrap:wrap;overflow:visible;justify-content:center}
  }

  /* ===== 移动端 ===== */
  @media (max-width:640px){
    header{padding:9px 12px 8px}

</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="seal">卦</div>
    <div>
      <h1>卦象问道</h1>
      <div class="sub"><span class="dot"></span>原文检索 · 句句有出处，可核对</div>
    </div>
    <div class="hbtns">
      <button class="hbtn" id="modelBtn" title="切换模型">模型</button>
      <button class="hbtn" onclick="location.href='/read.html'">读原文</button>

      <div class="avatar">卦</div>
      <div class="body"><div class="bubble">我只从《改命记实录》里翻原文，不编。

问风水、家居、财位、方位、日子，我找出处，把<b>第几章、第几段</b>标给你，原句逐字摘出来，能核对。书里没写的，直接说「没有」。

也可以传图：户型图、房间照片、罗盘照片。
</div></div>
    </div>
  </div>
</main>

<footer>
  <div class="quick" id="quick">
    <button>家里的财位怎么找</button>
    <button>客厅怎么摆来财</button>

    <button>厨房怎么布置</button>
    <button>大门玄关怎么布置</button>
    <button>家里风水有什么禁忌</button>

    <button>鱼缸放哪里</button>

  </div>
  <div class="imgwrap" id="imgWrap">
    <div class="imgcard">
      <img id="imgPrev" alt="预览">
      <div class="imgmeta">
        <div class="n" id="imgName">图片</div>

      </div>

  </div>
  <div class="bar">
    <button id="imgBtn" title="上传图片（户型图 / 房间照片）" aria-label="上传图片">
      <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5A2.5 2.5 0 0 1 5.5 6h1.6l1.2-1.8a1 1 0 0 1 .84-.45h3.72a1 1 0 0 1 .84.45L15 6h3.5A2.5 2.5 0 0 1 21 8.5v9A2.5 2.5 0 0 1 18.5 20h-13A2.5 2.5 0 0 1 3 17.5z"/><circle cx="12" cy="13" r="3.6"/></svg>
    </button>
    <input type="file" id="imgInput" accept="image/*" hidden>
    <button id="micBtn" title="语音输入" aria-label="语音输入" hidden>
      <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11.5a7 7 0 0 0 14 0"/><path d="M12 18.5V21"/></svg>
    </button>
    <textarea id="q" rows="1" placeholder="问点什么…"></textarea>
    <button id="send" title="发送" aria-label="发送问题">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="M5.5 11.5 12 5l6.5 6.5"/></svg>
    </button>
  </div>
  <div class="hint">回答严格依据书中原文 · 仅供参考，不构成决策依据</div>
</footer>

<script>
const chat=document.getElementById('chat'), q=document.getElementById('q'),
      send=document.getElementById('send'), main=document.getElementById('main'),
      modelSel=document.getElementById('modelSel'), mstat=document.getElementById('mstat');

let CURRENT_MODEL = localStorage.getItem('gxw_model') || '';
let BUSY = false;
const HISTORY = []; // 最近几轮，给模型做指代消解

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const el=h=>{const d=document.createElement('div');d.innerHTML=h.trim();return d.firstElementChild};
const scrollBottom=()=>requestAnimationFrame(()=>{main.scrollTop=main.scrollHeight});
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ===== 模型列表 ===== */
(async function loadModels(){
  try{
    const r=await fetch('/api/models');
    const d=await r.json();
    const models=d.models||[];
    const groups={};
    models.forEach(m=>{(groups[m.group]||(groups[m.group]=[])).push(m)});
    modelSel.innerHTML='';
    ['推荐','中文强','快速','其他'].forEach(g=>{
      if(!groups[g])return;
      const og=document.createElement('optgroup'); og.label=g;
      groups[g].forEach(m=>{
        const o=document.createElement('option');
        o.value=m.id; o.textContent=`${m.label} · ${m.note}`;
        og.appendChild(o);
      });
      modelSel.appendChild(og);
    });
    const def=CURRENT_MODEL && models.some(m=>m.id===CURRENT_MODEL)?CURRENT_MODEL:(d.default||models[0]?.id||'');
    modelSel.value=def; CURRENT_MODEL=def;
  }catch(e){
    modelSel.innerHTML='<option value="">默认模型</option>';
    mstat.textContent='模型列表加载失败';
  }
})();
document.getElementById('modelBtn').addEventListener('click',()=>{
  document.getElementById('modelSheet').classList.add('on');
});
document.getElementById('sheetClose').addEventListener('click',()=>{
  document.getElementById('modelSheet').classList.remove('on');
});
document.getElementById('modelSheet').addEventListener('click',e=>{
  if(e.target.id==='modelSheet') e.currentTarget.classList.remove('on');
});

modelSel.addEventListener('change',()=>{
  CURRENT_MODEL=modelSel.value;
  localStorage.setItem('gxw_model',CURRENT_MODEL);
  mstat.textContent='已切换';
  setTimeout(()=>mstat.textContent='',1400);
});


/* ===== 图片上传 ===== */
const imgBtn=document.getElementById('imgBtn'), imgInput=document.getElementById('imgInput'),
      imgWrap=document.getElementById('imgWrap'), imgPrev=document.getElementById('imgPrev'),
      imgName=document.getElementById('imgName'), imgSize=document.getElementById('imgSize'),
      imgDel=document.getElementById('imgDel');
let PENDING_IMG = null; // {dataUrl, name, kb}

const MAX_EDGE = 1280, MAX_KB = 3500;

function fmtKB(bytes){ return (bytes/1024).toFixed(0)+' KB'; }

/** 客户端压缩：最长边 1280，jpeg 0.82，循环降质到 3.5MB 内 */
function compressImage(file){
  return new Promise((resolve,reject)=>{
    if(!/^image\//.test(file.type)) return reject(new Error('不是图片文件'));
    const url=URL.createObjectURL(file);
    const img=new Image();
    img.onload=()=>{
      URL.revokeObjectURL(url);
      let {width:w,height:h}=img;
      const scale=Math.min(1, MAX_EDGE/Math.max(w,h));
      w=Math.round(w*scale); h=Math.round(h*scale);
      const cv=document.createElement('canvas');
      cv.width=w; cv.height=h;
      const ctx=cv.getContext('2d');
      ctx.fillStyle='#fff'; ctx.fillRect(0,0,w,h);
      ctx.drawImage(img,0,0,w,h);
      let q=0.86, out=cv.toDataURL('image/jpeg',q);
      while(out.length/1024 > MAX_KB && q>0.4){
        q-=0.08;
        out=cv.toDataURL('image/jpeg',q);
      }
      resolve({dataUrl:out, name:file.name||'image.jpg', kb:Math.round(out.length/1024)});
    };
    img.onerror=()=>{ URL.revokeObjectURL(url); reject(new Error('图片读取失败')); };
    img.src=url;
  });
}

function setPendingImage(img){
  PENDING_IMG=img;
  if(!img){ imgWrap.classList.remove('on'); return; }
  imgPrev.src=img.dataUrl;
  imgName.textContent=img.name;
  imgSize.textContent=`${img.kb} KB · 已压缩`;
  imgWrap.classList.add('on');
}

async function pickImage(file){
  if(!file) return;
  imgBtn.classList.add('loading');
  imgSize.textContent='处理中…';
  try{
    const img=await compressImage(file);
    setPendingImage(img);
  }catch(e){
    alert('图片处理失败：'+e.message);
  }finally{
    imgBtn.classList.remove('loading');
  }
}

imgBtn.addEventListener('click',()=>imgInput.click());
imgInput.addEventListener('change',e=>{
  const f=e.target.files&&e.target.files[0];
  pickImage(f);
  imgInput.value='';
});
imgDel.addEventListener('click',()=>setPendingImage(null));

/* 拖拽 */
let dragDepth=0;
window.addEventListener('dragenter',e=>{
  if(!e.dataTransfer||!Array.from(e.dataTransfer.types||[]).includes('Files'))return;
  dragDepth++; document.body.classList.add('dragover');
});
window.addEventListener('dragleave',()=>{
  dragDepth=Math.max(0,dragDepth-1);
  if(dragDepth===0) document.body.classList.remove('dragover');
});
window.addEventListener('dragover',e=>e.preventDefault());
window.addEventListener('drop',e=>{
  e.preventDefault();
  dragDepth=0; document.body.classList.remove('dragover');
  const f=e.dataTransfer?.files?.[0];
  if(f) pickImage(f);
});

/* 粘贴图片 */
window.addEventListener('paste',e=>{
  const items=e.clipboardData?.items||[];
  for(const it of items){
    if(it.type&&it.type.startsWith('image/')){
      const f=it.getAsFile();
      if(f){ pickImage(f); e.preventDefault(); }
      break;
    }
  }
});


/* ===== 语音输入（Web Speech API） ===== */
(function(){
  const btn=document.getElementById('micBtn');
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ btn.hidden = true; return; }
  btn.hidden = false;
  let rec=null, recording=false;

  btn.addEventListener('click',()=>{
    if(recording){ try{rec.stop()}catch{}; return; }
    try{
      rec = new SR();
      rec.lang = 'zh-CN';
      rec.interimResults = true;
      rec.continuous = false;
      rec.maxAlternatives = 1;

      let base = q.value ? q.value + ' ' : '';
      rec.onstart = ()=>{ recording=true; btn.classList.add('rec'); btn.title='正在听…（再点停止）'; };
      rec.onresult = (e)=>{
        let txt='';
        for(let i=e.resultIndex;i<e.results.length;i++) txt += e.results[i][0].transcript;
        q.value = base + txt;
        q.style.height='auto';
        q.style.height=Math.min(q.scrollHeight,132)+'px';
      };
      rec.onerror = (e)=>{
        recording=false; btn.classList.remove('rec'); btn.title='语音输入';
        if(e.error==='not-allowed') alert('麦克风权限被拒绝，请在浏览器里允许后重试');
        else if(e.error!=='no-speech' && e.error!=='aborted') console.warn('speech error', e.error);
      };
      rec.onend = ()=>{ recording=false; btn.classList.remove('rec'); btn.title='语音输入'; };
      rec.start();
    }catch(e){ console.warn('speech start failed', e); }
  });
})();

/* ===== 消息渲染 ===== */
function addUser(t, img){
  const thumb = img ? `<img src="${img.dataUrl}" alt="上传的图片" style="max-width:100%;border-radius:10px;margin-bottom:8px;display:block;border:1px solid #e3d6bf">` : '';
  chat.appendChild(el(`<div class="msg user"><div class="avatar">我</div><div class="body"><div class="bubble">${thumb}${esc(t)}</div></div></div>`));
  scrollBottom();
}
function addTyping(){
  const n=el(`<div class="msg bot"><div class="avatar">卦</div><div class="body"><div class="bubble"><span class="typing"><i></i><i></i><i></i><span>翻书中…</span></span></div></div></div>`);
  chat.appendChild(n);scrollBottom();return n;
}
function badgeCls(v){
  return v==='有依据'?'ok':v==='部分依据'?'part':v==='无依据'?'no':'fail';
}
function typeWriter(node, text, done){
  if(reduceMotion){node.textContent=text;done&&done();return}
  let i=0;
  const step=Math.max(12, Math.min(26, 900/Math.max(text.length,1)));
  const t=setInterval(()=>{
    i=Math.min(text.length, i+2);
    node.textContent=text.slice(0,i);
    if(i>=text.length){clearInterval(t);done&&done()}
  },step);
}
function addBot(d){
  const quotes=(d.quotes||[]).map(qq=>{
    const c=(d.citations||[]).find(x=>x.n===qq.ref)||{};
    const t=(c.title||'').replace(/^第\d+[章篇]?\s*/,'');
    return `<details class="q" id="q-${qq.ref}" data-ref="${qq.ref}">
      <summary>
        <span class="qno">[${qq.ref}]</span>
        <span class="qmeta">
          <span class="t">${esc(t||'原文')}</span>
          <span class="p">第 ${c.ch??'?'} 章 · 第 ${c.p0??'?'}–${c.p1??'?'} 段</span>
        </span>
        ${c.ch?`<a class="open-orig" href="/read?ch=${c.ch}${c.p0?`&p=${c.p0}`:''}" target="_blank" rel="noopener" onclick="event.stopPropagation()">原文</a>`:''}
        <span class="chev">▶</span>
      </summary>
      <div class="qtext">${esc(qq.quote)}
        <span class="verify ${qq.verified?'ok':'bad'}">${qq.verified?'已在原文中核对到':'未能与原文逐字匹配'}</span>
      </div>
    </details>`;
  }).join('');

  const points=(d.points||[]).map((p,i)=>`
    <div class="point ${p.verified?'':'weak'}" style="--i:${i}">
      <div class="num">${i+1}</div>
      <div class="txt">${esc(p.text)}${(p.refs||[]).map(r=>`<button type="button" class="ref" data-ref="${r}" aria-label="查看第 ${r} 条原文">[${r}]</button>`).join('')}</div>
    </div>`).join('');

  const node=el(`<div class="msg bot">
    <div class="avatar">卦</div>
    <div class="body">
      <div class="card">
        <div class="card-head">
          <span class="badge ${badgeCls(d.verdict)}">${esc(d.verdict||'—')}</span>
          <span class="tag">依据 ${d.citations?.length||0} 段原文${d.cached?"（缓存）":""}</span>
          <span class="spacer"></span>
          <button class="copybtn">复制</button>
        </div>
        <div class="conclusion"><span class="q">「</span><span class="cw"></span><span class="q">」</span><span class="caret"></span></div>
        ${points?`<div class="points">${points}</div>`:''}
        ${d.vision&&d.vision.ok?`<div class="visionbox"><div class="vt">图片识别结果</div>${esc(d.vision.text)}</div>`:''}
        ${d.vision&&!d.vision.ok?`<div class="missing"><b>图片识别失败：</b>${esc(d.vision.error||'未知原因')}，已按文字提问处理。</div>`:''}
        ${d.missing?`<div class="missing"><b>书里没写的：</b>${esc(d.missing)}</div>`:''}
        ${quotes?`<div class="quotes"><div class="quotes-title">原文依据 · 点开看原句</div>${quotes}</div>`:''}
        ${(()=>{
          const seen=new Set(); const links=[];
          for(const q of (d.quotes||[])){
            const c=(d.citations||[]).find(x=>x.n===q.ref);
            if(!c||seen.has(c.ch)) continue; seen.add(c.ch);
            links.push(`<a href="/read?ch=${c.ch}${c.p0?`&p=${c.p0}`:''}" target="_blank" rel="noopener">第${c.ch}章 ${esc((c.title||'').replace(/^第\d+[章篇]?\s*/,'').slice(0,12))}</a>`);
          }
          return links.length>1?`<div class="more"><span class="lab">延伸阅读</span>${links.slice(0,5).join('')}</div>`:'';
        })()}
        <div class="meta">
          <span>${esc((d.model||'').replace('@cf/',''))}</span>
          <span class="sp"></span>
          <button class="fb" data-vote="up" title="这条回答有用">有用</button>
          <button class="fb down" data-vote="down" title="这条回答没用">没用</button>
          <span>${d.elapsedMs||0} ms</span>
        </div>
      </div>
    </div>
  </div>`);

  // 打字机
  const cw=node.querySelector('.cw');
  typeWriter(cw, d.conclusion||'', ()=>{
    const caret=node.querySelector('.caret');
    if(caret) setTimeout(()=>caret.remove(), 900);
  });

  // 引用点击
  node.querySelectorAll('.ref').forEach(b=>{
    b.addEventListener('click',()=>{
      const r=b.dataset.ref;
      const t=node.querySelector(`#q-${r}`);
      if(!t)return;
      t.open=true;
      node.querySelectorAll('details.q').forEach(x=>x.classList.remove('hl'));
      t.classList.add('hl');
      t.scrollIntoView({behavior:'smooth',block:'center'});
    });
  });

  // 复制
  const cb=node.querySelector('.copybtn');
  cb.addEventListener('click',async()=>{
    const txt = (d.conclusion?d.conclusion+'\n\n':'') +
      (d.points||[]).map((p,i)=>`${i+1}. ${p.text} ${(p.refs||[]).map(r=>'['+r+']').join('')}`).join('\n') +
      '\n\n' + (d.quotes||[]).map(x=>`[${x.ref}] ${x.quote}`).join('\n');
    try{
      await navigator.clipboard.writeText(txt);
      cb.textContent='已复制'; cb.classList.add('done');
      setTimeout(()=>{cb.textContent='复制';cb.classList.remove('done')},1500);
    }catch{ cb.textContent='复制失败'; setTimeout(()=>cb.textContent='复制',1500) }
  });

  // 反馈
  node.querySelectorAll('.fb').forEach(btn=>{
    btn.addEventListener('click',()=>{
      node.querySelectorAll('.fb').forEach(x=>x.classList.remove('on'));
      btn.classList.add('on');
      fetch('/api/feedback',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({question:d.question||'', verdict:d.verdict||'', vote:btn.dataset.vote}),
        keepalive:true}).catch(()=>{});
    });
  });

  chat.appendChild(node);scrollBottom();
}

/* ===== 请求 ===== */
async function ask(text){
  const v=(text??q.value).trim();
  if((!v&&!PENDING_IMG)||BUSY)return;
  BUSY=true;
  const imgToSend = PENDING_IMG;
  q.value='';q.style.height='auto';
  setPendingImage(null);
  addUser(v || '（只看这张图）', imgToSend);
  const t=addTyping();
  const tip=t.querySelector('.typing span');
  send.disabled=true; send.classList.add('loading');
  if(imgToSend && tip) tip.textContent='正在识别图片…';
  // 并行检索：先让用户看到"找到了多少段"
  fetch('/api/search?q='+encodeURIComponent(v)+'&topK=6')
    .then(r=>r.ok?r.json():null)
    .then(d=>{ if(d&&tip&&t.isConnected) tip.textContent=`找到 ${d.citations.length} 段原文，正在组织答案…`; })
    .catch(()=>{});
  try{
    const ctrl=new AbortController();
    const timer=setTimeout(()=>ctrl.abort(), 110000);
    let r;
    try{
      r=await fetch('/api/ask',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({question:v, model:CURRENT_MODEL||undefined,
        history: HISTORY.slice(-3),
        image: imgToSend ? imgToSend.dataUrl : undefined}), signal:ctrl.signal});
    }finally{ clearTimeout(timer); }
    const d=await r.json();
    t.remove();
    if(!r.ok)throw new Error(d.error||('HTTP '+r.status));
    addBot(d);
    HISTORY.push({ q: v, a: (d.conclusion||'').slice(0,120) });
    if(HISTORY.length>6) HISTORY.shift();
  }catch(e){
    t.remove();
    chat.appendChild(el(`<div class="msg bot"><div class="avatar">卦</div><div class="body"><div class="bubble">出错了：${esc(e.message)}\n再试一次，或刷新页面。</div></div></div>`));
    scrollBottom();
  }finally{
    BUSY=false; send.disabled=false; send.classList.remove('loading');
    q.focus();
  }
}

send.addEventListener('click',()=>ask());
q.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();ask()}});
q.addEventListener('input',()=>{q.style.height='auto';q.style.height=Math.min(q.scrollHeight,132)+'px'});
document.getElementById('quick').addEventListener('click',e=>{
  if(e.target.tagName!=='BUTTON') return;
  const t=e.target.textContent;
  if(t.includes('户型图')){ imgInput.click(); return; }
  ask(t);
});

/* 清空 */
document.getElementById('clearBtn').addEventListener('click',()=>{
  const keep=chat.firstElementChild;
  chat.innerHTML='';
  chat.appendChild(keep);
  HISTORY.length=0;
  scrollBottom();
});

q.focus();
</script>
</body>
</html>
