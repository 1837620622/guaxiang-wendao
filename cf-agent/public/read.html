<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f3eee2">
<title>原文阅读 · 改命记实录</title>
<style>
  :root{
    --paper:#f3eee2; --paper2:#fbf8f0; --ink:#24221e; --ink2:#5f594d;
    --line:#ded3bd; --red:#a83b2c; --gold:#b08a4a; --shadow:0 8px 28px rgba(60,45,25,.09);
    --fs:18px; --lh:1.95;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0;color:var(--ink);
    background:
      radial-gradient(1100px 520px at 50% -12%, #fffdf6 0%, transparent 62%),
      var(--paper);
    font-family:"Songti SC","Noto Serif SC","Source Han Serif SC",-apple-system,"PingFang SC",serif;
    display:flex;flex-direction:column;
  }
  body.dark{
    --paper:#1c1b18; --paper2:#242320; --ink:#e8e3d6; --ink2:#a9a293;
    --line:#3a3730;
    background:radial-gradient(900px 420px at 50% -10%, #2a2823 0%, transparent 60%), var(--paper);
  }
  /* 进度条 */
  #progress{
    position:fixed;top:0;left:0;height:2px;width:0;z-index:60;
    background:linear-gradient(90deg,#b8452f,#d9a04a);transition:width .15s;
  }
  header{
    position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:10px;
    padding:12px 16px;border-bottom:1px solid var(--line);
    background:color-mix(in srgb, var(--paper2) 92%, transparent);
    backdrop-filter:blur(12px);
  }
  .btn{
    border:1px solid var(--line);background:var(--paper2);color:var(--ink2);
    border-radius:9px;padding:7px 11px;font-size:13px;cursor:pointer;
    font-family:inherit;transition:.15s;white-space:nowrap;
  }
  .btn:hover{border-color:var(--gold);color:var(--ink)}
  .btn:active{transform:scale(.96)}
  .title{flex:1;min-width:0;font-size:14.5px;font-weight:600;letter-spacing:.04em;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .spacer{flex:1}

  /* 布局 */
  .layout{flex:1;display:flex;min-height:0}
  aside{
    width:300px;flex:none;border-right:1px solid var(--line);
    display:flex;flex-direction:column;background:var(--paper2);
  }
  .toc-head{padding:10px 12px;border-bottom:1px solid var(--line)}
  .toc-search{
    width:100%;border:1px solid var(--line);border-radius:9px;background:var(--paper);
    padding:8px 11px;font-size:13px;color:var(--ink);font-family:inherit;outline:none;
  }
  .toc-search:focus{border-color:var(--gold)}
  .toc-meta{padding:8px 12px;font-size:11px;color:var(--ink2);font-family:-apple-system,sans-serif}
  nav#toc{flex:1;overflow-y:auto;padding:4px 0 40px}
  nav#toc a{
    display:block;padding:8px 14px;font-size:13.5px;color:var(--ink2);text-decoration:none;
    border-left:3px solid transparent;line-height:1.5;
  }
  nav#toc a:hover{background:color-mix(in srgb, var(--gold) 10%, transparent);color:var(--ink)}
  nav#toc a.active{
    border-left-color:var(--red);color:var(--red);font-weight:600;
    background:color-mix(in srgb, var(--red) 7%, transparent);
  }
  nav#toc .grp{
    padding:10px 14px 4px;font-size:10.5px;color:var(--ink2);letter-spacing:.12em;
    font-family:-apple-system,sans-serif;opacity:.8;
  }

  main{flex:1;overflow-y:auto;scroll-behavior:smooth}
  .reader{max-width:760px;margin:0 auto;padding:34px 26px 120px}
  h1.ch{
    font-size:22px;margin:0 0 8px;letter-spacing:.04em;line-height:1.5;
  }
  .chmeta{font-size:11.5px;color:var(--ink2);font-family:-apple-system,sans-serif;margin-bottom:26px}
  .body p{
    margin:0 0 .9em;text-indent:2em;font-size:var(--fs);line-height:var(--lh);
    text-align:justify;letter-spacing:.01em;border-radius:4px;transition:background .3s;
  }
  .body p.hl{background:color-mix(in srgb, var(--gold) 22%, transparent);box-shadow:0 0 0 6px color-mix(in srgb, var(--gold) 22%, transparent)}
  .nav{
    display:flex;gap:12px;margin-top:44px;padding-top:22px;border-top:1px solid var(--line);
  }
  .nav a{
    flex:1;text-align:center;padding:12px;border:1px solid var(--line);border-radius:11px;
    text-decoration:none;color:var(--ink2);font-size:13.5px;background:var(--paper2);
    transition:.15s;
  }
  .nav a:hover{border-color:var(--gold);color:var(--ink)}
  .nav a.disabled{opacity:.35;pointer-events:none}

  /* 移动端：目录抽屉 */
  @media (max-width:820px){
    aside{
      position:fixed;inset:0 auto 0 0;width:88%;max-width:340px;z-index:50;
      transform:translateX(-102%);transition:transform .26s cubic-bezier(.2,.8,.3,1);
      box-shadow:0 0 40px rgba(0,0,0,.25);
    }
    aside.open{transform:none}
    #mask{
      position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:45;opacity:0;
      pointer-events:none;transition:opacity .2s;
    }
    #mask.show{opacity:1;pointer-events:auto}
    .reader{padding:24px 18px 100px}
    h1.ch{font-size:19px}
  }
  .loading{text-align:center;color:var(--ink2);padding:60px 0;font-size:14px}
  .loading i{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--gold);
    margin:0 2px;animation:b 1.1s infinite}
  .loading i:nth-child(2){animation-delay:.15s}
  .loading i:nth-child(3){animation-delay:.3s}
  @keyframes b{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-5px);opacity:1}}
</style>
</head>
<body>
<div id="progress"></div>
<header>
  <button class="btn" id="tocBtn">目录</button>
  <div class="title" id="title">改命记实录</div>
  <button class="btn" id="fontBtn">Aa</button>
  <button class="btn" id="darkBtn">夜</button>
  <button class="btn" onclick="location.href='/'">问答</button>
</header>

<div class="layout">
  <aside id="aside">
    <div class="toc-head"><input class="toc-search" id="tocSearch" placeholder="搜索章节…"></div>
    <div class="toc-meta" id="tocMeta">加载中…</div>
    <nav id="toc"></nav>
  </aside>
  <div id="mask"></div>

  <main id="main">
    <div class="reader" id="reader">
      <div class="loading"><i></i><i></i><i></i></div>
    </div>
  </main>
</div>

<script>
const tocEl=document.getElementById('toc'), tocMeta=document.getElementById('tocMeta'),
      reader=document.getElementById('reader'), titleEl=document.getElementById('title'),
      main=document.getElementById('main'), prog=document.getElementById('progress'),
      aside=document.getElementById('aside'), mask=document.getElementById('mask');

let TOC=[], CUR=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* 字号 / 主题持久化 */
let fs=parseFloat(localStorage.getItem('gx_fs')||'18');
document.documentElement.style.setProperty('--fs', fs+'px');
document.getElementById('fontBtn').onclick=()=>{
  fs = fs>=24 ? 16 : fs+2;
  document.documentElement.style.setProperty('--fs', fs+'px');
  localStorage.setItem('gx_fs', fs);
};
const darkBtn=document.getElementById('darkBtn');
if(localStorage.getItem('gx_dark')==='1') document.body.classList.add('dark');
darkBtn.onclick=()=>{
  document.body.classList.toggle('dark');
  localStorage.setItem('gx_dark', document.body.classList.contains('dark')?'1':'0');
};

/* 目录 */
document.getElementById('tocBtn').onclick=()=>{
  aside.classList.toggle('open');
  mask.classList.toggle('show', aside.classList.contains('open'));
};
mask.onclick=()=>{ aside.classList.remove('open'); mask.classList.remove('show'); };

function renderToc(filter=''){
  const q=filter.trim();
  const list = q ? TOC.filter(x=>x.title.includes(q)) : TOC;
  tocMeta.textContent = q ? `匹配 ${list.length} 章` : `共 ${TOC.length} 章`;
  tocEl.innerHTML = list.map(x=>
    `<a href="#ch-${x.ord}" data-no="${x.no}" data-ord="${x.ord}" class="${CUR&&CUR.ord===x.ord?'active':''}">${esc(x.title)}</a>`
  ).join('');
}
document.getElementById('tocSearch').addEventListener('input',e=>renderToc(e.target.value));
tocEl.addEventListener('click',e=>{
  const a=e.target.closest('a'); if(!a)return;
  e.preventDefault();
  if(window.innerWidth<=820){ aside.classList.remove('open'); mask.classList.remove('show'); }
  loadChapter(Number(a.dataset.no));
});

/* 阅读进度 */
main.addEventListener('scroll',()=>{
  const h=main.scrollHeight-main.clientHeight;
  prog.style.width = h>0 ? (main.scrollTop/h*100)+'%' : '0';
});

async function loadChapter(no){
  reader.innerHTML='<div class="loading"><i></i><i></i><i></i></div>';
  try{
    const r=await fetch('/api/chapter?no='+encodeURIComponent(no));
    const d=await r.json();
    if(!r.ok) throw new Error(d.error||'加载失败');
    CUR=d;
    titleEl.textContent=d.title;
    document.title=d.title+' · 改命记实录';
    // 先记下要定位的段落，再改 URL（否则 ?p= 被抹掉）
    const targetPara=Number(new URLSearchParams(location.search).get('p'))||0;
    history.replaceState(null,'',`?ch=${d.no}`);
    const plist=(d.body||'').split('\n').filter(Boolean);
    const paras=plist.map((p,i)=>`<p id="p${i+1}">${esc(p)}</p>`).join('');
    reader.innerHTML=`
      <h1 class="ch">${esc(d.title)}</h1>
      <div class="chmeta">第 ${d.no} 章 · 约 ${(d.body||'').length} 字</div>
      <div class="body">${paras}</div>
      <div class="nav">
        <a href="#" class="${d.prev?'':'disabled'}" data-no="${d.prev?d.prev.no:''}">← ${d.prev?esc(d.prev.title.slice(0,14)):'已是第一章'}</a>
        <a href="#" class="${d.next?'':'disabled'}" data-no="${d.next?d.next.no:''}">${d.next?esc(d.next.title.slice(0,14)):'已是最后一章'} →</a>
      </div>`;
    reader.querySelectorAll('.nav a').forEach(a=>{
      a.onclick=e=>{ e.preventDefault(); if(a.dataset.no) loadChapter(Number(a.dataset.no)); };
    });
    // 定位到引用段落
    const target=targetPara;
    if(target>0){
      const el=document.getElementById('p'+target);
      if(el){
        requestAnimationFrame(()=>setTimeout(()=>{
          el.scrollIntoView({block:'center'});
          el.classList.add('hl');
          setTimeout(()=>el.classList.remove('hl'), 3000);
        }, 120));
      }
    } else {
      main.scrollTop=0;
    }
    prog.style.width='0';
    document.querySelectorAll('#toc a').forEach(a=>{
      a.classList.toggle('active', Number(a.dataset.no)===Number(d.no));
    });
    const act=document.querySelector('#toc a.active');
    if(act) act.scrollIntoView({block:'nearest'});
  }catch(e){
    reader.innerHTML=`<div class="loading">加载失败：${esc(e.message)}</div>`;
  }
}

/* 键盘翻章 */
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT')return;
  if(e.key==='ArrowLeft'&&CUR&&CUR.prev) loadChapter(CUR.prev.no);
  if(e.key==='ArrowRight'&&CUR&&CUR.next) loadChapter(CUR.next.no);
});

/* 初始化 */
(async function(){
  try{
    const r=await fetch('/api/toc');
    const d=await r.json();
    TOC=d.chapters||[];
    renderToc();
    const params=new URLSearchParams(location.search);
    const ch=Number(params.get('ch'))||1;
    loadChapter(ch);
  }catch(e){
    tocMeta.textContent='目录加载失败';
    reader.innerHTML=`<div class="loading">目录加载失败：${esc(e.message)}</div>`;
  }
})();
</script>
</body>
</html>
